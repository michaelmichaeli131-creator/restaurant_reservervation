# Temporary Railway build routing workaround for Metal/V3 scheduling failures.
# Keep runtime, healthcheck and restart behavior aligned with production.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildEnvironment = "V2"

[deploy]
runtime = "V2"
healthcheckPath = "/__health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
