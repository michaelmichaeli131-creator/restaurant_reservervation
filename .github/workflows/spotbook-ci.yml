name: SpotBook source validation

on:
  push:
    branches:
      - deploy/spotbook-modernized
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-modernized-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.4'

      - name: Reconstruct modernized source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -d .deploy2
          cat .deploy2/part* | base64 -d | xz -d | tar -x -C .
          rm -rf .deploy .deploy2
          echo 'Modernized source overlay reconstructed.'

      - name: Type-check server
        run: deno check --unstable-kv server.ts

      - name: Validate templates
        run: deno run --allow-read --allow-env scripts/validate_templates.ts

      - name: Run booking, payment and session tests
        shell: bash
        run: |
          set -euo pipefail
          deno test \
            --allow-env \
            --allow-read \
            --allow-write \
            --allow-net \
            --allow-sys \
            --unstable-kv \
            tests/booking_validation_test.ts \
            tests/booking_race_test.ts \
            tests/payment_session_test.ts \
            tests/session_security_test.ts

      - name: Summary
        run: echo 'Modernized SpotBook source validation passed.'
