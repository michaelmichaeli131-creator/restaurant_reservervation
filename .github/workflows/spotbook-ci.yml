name: SpotBook source validation

on:
  push:
    branches:
      - deploy/spotbook-modernized
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-modernized-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.4'

      - name: Reconstruct modernized source overlay
        shell: bash
        run: |
          set -euo pipefail
          test -d .deploy2
          cat .deploy2/part* | base64 -d | xz -d | tar -x -C .
          rm -rf .deploy .deploy2
          echo 'Modernized source overlay reconstructed.'

      # Keep collecting functional signal even while legacy/modernized type debt
      # is being reduced. The final gate still fails if this step fails.
      - name: Type-check server
        id: typecheck
        continue-on-error: true
        run: deno check --unstable-kv server.ts

      - name: Validate templates
        id: templates
        continue-on-error: true
        run: deno run --allow-read --allow-env scripts/validate_templates.ts

      - name: Run booking, payment and session tests
        id: coretests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          deno test \
            --allow-env \
            --allow-read \
            --allow-write \
            --allow-net \
            --allow-sys \
            --unstable-kv \
            tests/booking_validation_test.ts \
            tests/booking_race_test.ts \
            tests/payment_session_test.ts \
            tests/session_security_test.ts

      - name: Validation summary
        shell: bash
        run: |
          echo "typecheck=${{ steps.typecheck.outcome }}"
          echo "templates=${{ steps.templates.outcome }}"
          echo "coretests=${{ steps.coretests.outcome }}"

          failed=0
          [[ "${{ steps.typecheck.outcome }}" == "success" ]] || failed=1
          [[ "${{ steps.templates.outcome }}" == "success" ]] || failed=1
          [[ "${{ steps.coretests.outcome }}" == "success" ]] || failed=1

          if [[ "$failed" -ne 0 ]]; then
            echo 'One or more validation layers failed. See the individual steps above.' >&2
            exit 1
          fi
          echo 'Modernized SpotBook source validation passed.'
