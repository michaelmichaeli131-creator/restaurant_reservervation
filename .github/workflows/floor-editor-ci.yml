name: Floor editor client validation

on:
  push:
    branches:
      - feature/spotbook-floor-session-2
      - feature/spotbook-floor-session-3
      - feature/spotbook-floor-session-4
      - feature/spotbook-floor-session-4-completion
      - deploy/spotbook-modernized
    paths:
      - 'client/**'
      - '.github/workflows/floor-editor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-floor-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts
      # Existing TS errors elsewhere in the client predate session 2; keep them visible.
      - name: Type-check full client (informational legacy debt)
        working-directory: client
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Strict-check new geometry module
        working-directory: client
        run: npx tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution bundler --allowImportingTsExtensions src/components/floorBatch.ts src/components/floorClipboard.ts
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Run floor group geometry tests
        working-directory: client
        run: node --experimental-strip-types tests/floor-batch.test.mjs
      - name: Clipboard placement regression
        working-directory: client
        run: node --experimental-strip-types tests/floor-clipboard.test.mjs
      - name: Existing resize regression
        working-directory: client
        run: node tests/resize-regression.mjs
